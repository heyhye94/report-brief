<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>리포트 브리프</title>
  <meta name="description" content="정출연·컨설팅펌·부처·협회의 새 보고서를 매일 쉽게 요약해 드려요." />
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="리포트 브리프" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <h1 class="brand"><span class="logo" aria-hidden="true"></span><span>리포트 브리프</span></h1>
      <nav class="day-nav" aria-label="날짜 이동">
        <button id="prevDay" class="icon-btn" aria-label="이전 날짜">‹</button>
        <label class="day-pick">
          <span id="dayLabel"></span>
          <select id="daySelect" aria-label="날짜 선택"></select>
        </label>
        <button id="nextDay" class="icon-btn" aria-label="다음 날짜">›</button>
        <button id="bellBtn" class="icon-btn bell" aria-label="새 보고서 알림 설정">🔔</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div id="offline" class="notice" hidden>📡 오프라인이에요. 마지막으로 받은 브리핑을 보여 드려요.</div>

    <section id="hero" class="hero" aria-live="polite"></section>
    <section id="themes" class="section" hidden></section>
    <section id="extras" class="extras" hidden></section>

    <div class="bar" id="bar">
      <div class="bar-row">
        <div id="topicChips" class="chips" role="tablist" aria-label="주제 필터"></div>
        <button id="searchBtn" class="icon-btn search-btn" aria-label="검색 열기" aria-expanded="false">⌕</button>
      </div>
      <div id="chips" class="chips sub" role="tablist" aria-label="발간처 필터"></div>
      <div id="searchRow" class="search-row" hidden>
        <input id="search" type="search" placeholder="제목·키워드·기관으로 찾기" aria-label="검색" />
      </div>
      <div class="progress" aria-live="polite">
        <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
        <span id="progressText"></span>
      </div>
    </div>

    <section id="list" class="list"></section>
    <p id="empty" class="empty" hidden></p>

    <details class="sources">
      <summary>수집 기관과 상태</summary>
      <ul id="sourceList"></ul>
    </details>
  </main>

  <footer class="wrap foot">
    <span id="updated"></span><br />요약은 AI가 만들어요. 중요한 판단 전에는 원문을 꼭 확인해 주세요.
  </footer>

  <dialog id="pushDialog" class="sheet" aria-labelledby="pushTitle">
    <div class="sheet-head">
      <h2 id="pushTitle">🔔 새 보고서 알림</h2>
      <button class="icon-btn" id="pushClose" aria-label="닫기">✕</button>
    </div>
    <div id="pushBody"></div>
  </dialog>

  <button id="toTop" class="to-top" aria-label="맨 위로" hidden>↑</button>

  <script src="app.js" type="module"></script>
</body>
</html>
